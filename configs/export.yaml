# FR-07 / FR-08 — Cau hinh chuyen doi dinh dang.
#
# Cac gia tri nay da duoc kiem chung bang scripts/smoke_tensorrt.sh tren
# Jetson Orin Nano / JetPack 6.2 / TensorRT 10.3.0 / CUDA 12.6.
# Doi bat ky dong nao thi phai chay lai smoke test truoc khi tin so benchmark.

onnx:
  opset: 17           # smoke test: opset 17 nhanh hon opset 12 ~14% tren cung engine
  imgsz: 640
  batch: 1            # benchmark do tung anh mot, dung batch dong
  dynamic: false      # shape co dinh -> TensorRT toi uu duoc manh hon
  simplify: true
  half: false         # giu FP32 o buoc ONNX; ha xuong FP16 la viec cua TensorRT

tensorrt:
  precision: fp16
  workspace_mib: 2048
  # TensorRT 10 da BO co --workspace, dung --memPoolSize=workspace:<N>MiB
  trtexec: /usr/src/tensorrt/bin/trtexec
  builder_optimization_level: 3   # mac dinh cua trtexec; tang len 5 lau hon nhieu

parity:
  n_images_onnx: 10   # FR-07: lech dau ra tho PyTorch vs ONNX
  tolerance: 1.0e-3
  n_images_full: 50   # FR-09: so sanh detection cuoi cung cua ca ba dinh dang
  conf: 0.25
  iou: 0.7
