onnx:
  opset: 17
  imgsz: 672
  batch: 1
  dynamic: false
  simplify: true
  half: false

tensorrt:
  precision: fp16
  workspace_mib: 2048
  trtexec: /usr/src/tensorrt/bin/trtexec
  builder_optimization_level: 3

parity:
  n_images_onnx: 10

  tolerance: 1.0e-3
  tolerance_box_px: 0.1
  tolerance_score: 1.0e-3
  n_images_full: 50
  conf: 0.25
  iou: 0.7
