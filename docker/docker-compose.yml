services:
  ivid:
    build:
      context: ..
      dockerfile: docker/Dockerfile.jetson
      network: host
      args:
        L4T_TAG: ${L4T_TAG:-r36.4.0}
    image: ivid:jetson
    container_name: ivid
    runtime: nvidia
    restart: unless-stopped
    network_mode: host
    environment:
      IVID_BACKEND: ${IVID_BACKEND:-tensorrt}
      IVID_MODEL: ${IVID_MODEL:-yolov8n}
      IVID_IMGSZ: ${IVID_IMGSZ:-672}
      IVID_RESIZE_TO: ${IVID_RESIZE_TO:-640}
      IVID_CONF: ${IVID_CONF:-0.25}
      IVID_MAX_UPLOAD_MB: ${IVID_MAX_UPLOAD_MB:-10}
    volumes:
      - ../models:/app/models:ro
      - ../data/processed:/app/data/processed:ro
    mem_limit: 4g
